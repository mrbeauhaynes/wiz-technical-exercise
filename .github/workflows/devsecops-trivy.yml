name: DevSecOps Shift-Left Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-scan:
    name: Container and IaC Vulnerability Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image Locally
        run: |
          docker build -t wiz-webapp:latest .

      - name: Scan Container Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'wiz-webapp:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: false
          severity: 'HIGH,CRITICAL'
          output: 'trivy-container-report.txt'

      - name: Scan IaC and Repository Secrets with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          severity: 'HIGH,CRITICAL'
          output: 'trivy-iac-report.txt'

      - name: Publish Security Audit Summary to GitHub Run
        if: always()
        run: |
          echo "## DevSecOps Pipeline Security Report" >> $GITHUB_STEP_SUMMARY
          echo "### Container Image Scan (wiz-webapp:latest)" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat trivy-container-report.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "### IaC & Secret Misconfiguration Scan" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat trivy-iac-report.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
