apiVersion: v1
kind: Namespace
metadata:
  name: wiz-app
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: webapp-overprivileged-sa
  namespace: wiz-app
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: webapp-cluster-admin-binding
subjects:
  - kind: ServiceAccount
    name: webapp-overprivileged-sa
    namespace: wiz-app
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-deployment
  namespace: wiz-app
  labels:
    app: webapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      serviceAccountName: webapp-overprivileged-sa
      containers:
        - name: webapp
          image: 671460501885.dkr.ecr.us-east-1.amazonaws.com/wiz-webapp:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          env:
            - name: MONGO_URI
              value: "mongodb://appuser:apppassword@10.0.1.140:27017/tododb?authSource=tododb"
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "250m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: webapp-service
  namespace: wiz-app
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  type: LoadBalancer
  selector:
    app: webapp
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
